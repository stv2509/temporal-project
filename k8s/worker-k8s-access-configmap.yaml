apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-k8s-access-env
  labels:
    app: autoops-worker-k8s-access
# TEMPORAL_ADDRESS, TEMPORAL_NAMESPACE, TEMPORAL_DEPLOYMENT_NAME, TEMPORAL_WORKER_BUILD_ID
# подставляет temporal-worker-controller в Pod (см. worker/runner.py).
data:
  WORKER_DOMAIN: "k8s_access"
  TEMPORAL_TASK_QUEUE_K8S_ACCESS: "awx-task-queue"
  AWX_ENV: "test"
  CA_BUNDLE_PATH: "true"
  BACKEND_API_URL: "http://autoops-backend:8000"
  BACKEND_API_USER: "admin"
  BACKEND_API_PASSWORD: ""
